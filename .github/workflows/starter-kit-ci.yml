name: Starter Kit CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Starter Kit tests
        run: npm run test:updater
      - name: Starter Kit self-test
        run: npm run starter-kit:self-test

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate manifest
        run: npm run starter-kit:manifest
      - name: Manifest must be committed
        run: git diff --exit-code -- starter-kit.manifest.json
