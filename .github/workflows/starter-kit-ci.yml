name: Starter Kit CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Starter Kit tests
        run: npm run test:updater
      - name: Starter Kit self-test
        run: npm run starter-kit:self-test
      - name: Updater contract self-test
        run: npm run starter-kit:update-self-test

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate manifest
        run: npm run starter-kit:manifest
      - name: Upload generated manifest
        uses: actions/upload-artifact@v4
        with:
          name: generated-starter-kit-manifest
          path: starter-kit.manifest.json
      - name: Manifest must be committed
        run: git diff --exit-code -- starter-kit.manifest.json

  package:
    runs-on: ubuntu-latest
    needs: [verify, manifest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package Starter Kit
        run: npm run starter-kit:package
      - name: Stage package artifact
        shell: bash
        run: |
          cp ../yandex-games-autonomous-starter-kit-*.zip .
          cp ../yandex-games-autonomous-starter-kit-*.zip.sha256 .
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: starter-kit-package
          path: |
            yandex-games-autonomous-starter-kit-*.zip
            yandex-games-autonomous-starter-kit-*.zip.sha256
