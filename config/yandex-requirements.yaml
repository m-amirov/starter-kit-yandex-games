schemaVersion: 1
source:
  title: Требования к игре — Яндекс Игры
  url: https://yandex.ru/dev/games/doc/ru/concepts/requirements
  lastModified: '2026-08-18'
  reviewedAt: '2026-09-19'
statuses:
  required: blocks release candidate when applicable and not PASS
  recommended: must be reviewed; unresolved failure is recorded as WARN unless elevated by project rules
  repealed: retained for traceability and never enforced
requirements:
  - { id: '1.1', enforcement: required, summary: 'SDK Яндекс Игр встроен и подключен официальным способом.', applicability: always, verification: sdk-static-and-runtime }
  - { id: '1.2', enforcement: required, summary: 'Сторонняя регистрация или авторизация не требуется; допустим Яндекс ID.', applicability: always, verification: manual-product }
  - { id: '1.2.1', enforcement: required, summary: 'Авторизация запускается только осознанным действием пользователя и объясняет причину.', applicability: authentication, verification: e2e-and-copy-review }
  - { id: '1.2.2', enforcement: required, summary: 'Есть гостевой режим или работа без авторизации; гостевой прогресс сохраняется.', applicability: authentication, verification: e2e-save }
  - { id: '1.3', enforcement: required, summary: 'При сворачивании страницы звук останавливается.', applicability: audio, verification: e2e-lifecycle }
  - { id: '1.4', enforcement: required, summary: 'Платежи выполняются только через SDK Яндекс Игр; внешних покупок нет.', applicability: purchases, verification: source-and-product }
  - { id: '1.5', enforcement: repealed, summary: 'Упразднен; см. 4.1.', applicability: never, verification: none }
  - { id: '1.6', enforcement: required, summary: 'Игра соответствует всем заявленным типам устройств.', applicability: always, verification: platform-matrix }
  - { id: '1.6.1.1', enforcement: required, summary: 'На мобильных игра находится в полноэкранном режиме во время запуска или геймплея.', applicability: mobile, verification: e2e-mobile }
  - { id: '1.6.1.2', enforcement: required, summary: 'Экранная клавиатура появляется по нажатию на поле ввода.', applicability: text-input, verification: e2e-mobile }
  - { id: '1.6.1.3', enforcement: repealed, summary: 'Упразднен; см. пункт 1.10.', applicability: never, verification: none }
  - { id: '1.6.1.4', enforcement: repealed, summary: 'Упразднен.', applicability: never, verification: none }
  - { id: '1.6.1.5', enforcement: required, summary: 'Мобильная версия полностью управляется жестами.', applicability: mobile, verification: e2e-input }
  - { id: '1.6.1.6', enforcement: required, summary: 'Системный медиаплеер браузера не отображается.', applicability: media, verification: e2e-media }
  - { id: '1.6.1.7', enforcement: required, summary: 'При открытии игры отсутствует уведомление WebGL.', applicability: mobile, verification: runtime }
  - { id: '1.6.1.8', enforcement: required, summary: 'Лонгтап по внутреннему полю не выделяет содержимое и не открывает контекстное меню.', applicability: mobile, verification: interaction-guard-e2e }
  - { id: '1.6.2.1', enforcement: required, summary: 'На десктопе активное поле растягивается до края доступной области по одной оси.', applicability: desktop, verification: responsive-e2e }
  - { id: '1.6.2.2', enforcement: required, summary: 'Длинная сторона активного поля не более чем вдвое превосходит короткую.', applicability: desktop, verification: responsive-e2e }
  - { id: '1.6.2.3', enforcement: repealed, summary: 'Упразднен; см. пункт 1.10.', applicability: never, verification: none }
  - { id: '1.6.2.4', enforcement: required, summary: 'Управление мышью или клавиатурой доступно по умолчанию.', applicability: desktop, verification: e2e-input }
  - { id: '1.6.2.5', enforcement: required, summary: 'Системный медиаплеер браузера не отображается.', applicability: media, verification: e2e-media }
  - { id: '1.6.2.6', enforcement: required, summary: 'Игра не перехватывает системные сочетания горячих клавиш.', applicability: desktop, verification: input-review }
  - { id: '1.6.2.7', enforcement: required, summary: 'Взаимодействие с игровым полем не выделяет содержимое и не открывает контекстное меню.', applicability: desktop, verification: interaction-guard-e2e }
  - { id: '1.6.3.1', enforcement: required, summary: 'На ТВ игра занимает всю доступную площадь и поддерживает полноэкранный режим.', applicability: tv, verification: tv-e2e }
  - { id: '1.6.3.2', enforcement: required, summary: 'Для полного прохождения достаточно стрелок ТВ-пульта.', applicability: tv, verification: tv-input-e2e }
  - { id: '1.6.3.3', enforcement: required, summary: 'Поддерживаются Back и OK ТВ-пульта.', applicability: tv, verification: tv-input-e2e }
  - { id: '1.6.3.4', enforcement: required, summary: 'На ТВ отсутствуют внутриигровые покупки.', applicability: tv, verification: product }
  - { id: '1.6.3.5', enforcement: required, summary: 'На ТВ отсутствуют ссылки на другие игры разработчика.', applicability: tv, verification: source-and-product }
  - { id: '1.7', enforcement: required, summary: 'В коде нет абсолютных URL на S3 Яндекса.', applicability: always, verification: source-scan }
  - { id: '1.8', enforcement: required, summary: 'Размеры элементов и кнопок исключают случайные нажатия и трудности взаимодействия.', applicability: always, verification: touch-target-audit }
  - { id: '1.9', enforcement: required, summary: 'Прогресс сохраняется сразу после значимого действия или специальной кнопкой и переживает перезагрузку.', applicability: progress, verification: save-e2e }
  - { id: '1.10.1', enforcement: required, summary: 'Активное поле и важные элементы не выходят за экран и не обрезаются критично.', applicability: always, verification: responsive-e2e-visual }
  - { id: '1.10.2', enforcement: required, summary: 'Нет системной прокрутки браузера и swipe-to-refresh.', applicability: always, verification: scroll-e2e }
  - { id: '1.10.3', enforcement: required, summary: 'Тексты и внутренние элементы не накладываются и не перекрывают важные объекты.', applicability: always, verification: layout-contract-and-visual }
  - { id: '1.10.4', enforcement: required, summary: 'Основной геймплей доступен одной рукой без обязательной внешней прокрутки.', applicability: mobile, verification: product-and-e2e }
  - { id: '1.11', enforcement: required, summary: 'Использование облачных сохранений указано в черновике.', applicability: cloud-save, verification: draft-checklist }
  - { id: '1.12', enforcement: required, summary: 'Подключена монетизация: в игре есть реклама или инап-покупки.', applicability: always, verification: monetization-contract }
  - { id: '1.13.1', enforcement: required, summary: 'Для покупок подключено консумирование.', applicability: purchases, verification: purchase-e2e }
  - { id: '1.13.2', enforcement: required, summary: 'Название и иконка портальной валюты получаются автоматически из SDK.', applicability: purchases, verification: sdk-runtime }
  - { id: '1.13.3', enforcement: required, summary: 'Прогресс покупок сохраняется на сервере и доступен с разных устройств.', applicability: purchases, verification: cloud-save-e2e }
  - { id: '1.13.4', enforcement: required, summary: 'Стоимость покупок указана цифрами и с портальной валютой.', applicability: purchases, verification: visual-copy-review }
  - { id: '1.13.5', enforcement: required, summary: 'Полученная покупка соответствует заявленным изображению, названию и составу.', applicability: purchases, verification: purchase-e2e }
  - { id: '1.13.6', enforcement: required, summary: 'Список активных покупок совпадает с Консолью разработчика.', applicability: purchases, verification: draft-checklist }
  - { id: '1.14', enforcement: required, summary: 'Нет ошибок, вылетов, зависаний и технических сообщений при поворотах, долгих нажатиях, рекламе, сворачивании и истории браузера.', applicability: always, verification: resilience-e2e }
  - { id: '1.15', enforcement: required, summary: 'Игра выглядит завершенной и не является сырой или тестовой сборкой.', applicability: always, verification: product-quality }
  - { id: '1.16', enforcement: required, summary: 'Встроенные рекламные блоки не модифицируются и не имитируются.', applicability: ads, verification: source-and-visual }
  - { id: '1.17', enforcement: repealed, summary: 'Упразднен.', applicability: never, verification: none }
  - { id: '1.18', enforcement: required, summary: 'Работа игры не ограничивается технически в зависимости от URL.', applicability: always, verification: source-scan-and-e2e }
  - { id: '1.19.1', enforcement: required, summary: 'SDK инициализируется строго по официальной документации.', applicability: always, verification: sdk-static-runtime }
  - { id: '1.19.2', enforcement: required, summary: 'LoadingAPI.ready вызывается один раз, когда игра уже интерактивна.', applicability: always, verification: sdk-lifecycle-e2e }
  - { id: '1.19.3', enforcement: required, summary: 'GameplayAPI start/stop, если используются, соответствуют фактическому геймплею.', applicability: gameplay-api, verification: sdk-lifecycle-e2e }
  - { id: '1.19.4', enforcement: required, summary: 'game_api_pause/resume, если используются, обрабатываются по документации.', applicability: platform-pause-events, verification: sdk-lifecycle-e2e }
  - { id: '1.20', enforcement: required, summary: 'Игра работает во всех заявленных браузерах и платформах.', applicability: always, verification: platform-matrix }
  - { id: '1.20.1', enforcement: required, summary: 'Поддерживаются заявленные браузеры: Яндекс Браузер, Chrome, Firefox, Opera, Safari и мобильное приложение Яндекс.', applicability: declared-browsers, verification: browser-matrix }
  - { id: '1.20.2', enforcement: required, summary: 'Десктопная ОС соответствует заявленному окружению.', applicability: desktop, verification: platform-matrix }
  - { id: '1.20.3', enforcement: required, summary: 'Мобильная ОС соответствует заявленному окружению.', applicability: mobile, verification: platform-matrix }
  - { id: '1.20.4', enforcement: required, summary: 'Android TV поддерживается, если заявлен.', applicability: tv, verification: tv-matrix }
  - { id: '1.21', enforcement: required, summary: 'Размер всех файлов игры в распакованном виде не превышает 100 МБ.', applicability: always, verification: build-size }
  - { id: '1.22', enforcement: required, summary: 'index.html находится в корне архива; в именах нет пробелов и кириллицы.', applicability: always, verification: zip-inspection }
  - { id: '1.23', enforcement: required, summary: 'В игре нет интерактивного ИИ; заранее сгенерированные ИИ-материалы допустимы.', applicability: always, verification: product-and-source }
  - { id: '1.24', enforcement: required, summary: 'Обновление сохраняет основную концепцию игры.', applicability: update-release, verification: release-diff-review }
  - { id: '2.1', enforcement: required, summary: 'Содержание, удобство и качество игрового процесса достаточно проработаны.', applicability: always, verification: product-quality }
  - { id: '2.2', enforcement: required, summary: 'Управление полностью описано в игре или сопроводительных полях.', applicability: always, verification: copy-review }
  - { id: '2.3', enforcement: required, summary: 'Фактический геймплей соответствует заявленным жанру и категориям.', applicability: always, verification: genre-category-review }
  - { id: '2.4', enforcement: required, summary: 'Игра содержит минимум одну полноценную мотивирующую игровую механику.', applicability: always, verification: gameplay-mechanics-review }
  - { id: '2.5', enforcement: repealed, summary: 'Упразднен; см. раздел 6.', applicability: never, verification: none }
  - { id: '2.6', enforcement: repealed, summary: 'Упразднен; см. пункт 1.9.', applicability: never, verification: none }
  - { id: '2.7', enforcement: required, summary: 'Возрастной тег соответствует содержанию.', applicability: always, verification: content-rating-review }
  - { id: '2.8', enforcement: required, summary: 'Есть нарастающая сложность и понятный сюжет или сеттинг.', applicability: always, verification: content-review }
  - { id: '2.9', enforcement: required, summary: 'Основного содержания достаточно более чем на 10 минут.', applicability: always, verification: content-duration-evidence }
  - { id: '2.10', enforcement: repealed, summary: 'Упразднен; см. пункт 8.2.3.', applicability: never, verification: none }
  - { id: '2.11', enforcement: repealed, summary: 'Упразднен; см. 1.8.', applicability: never, verification: none }
  - { id: '2.12', enforcement: repealed, summary: 'Упразднен.', applicability: never, verification: none }
  - { id: '2.13', enforcement: required, summary: 'После периода формирования рейтинг игры должен оставаться выше 30.', applicability: post-publication, verification: operational-monitoring }
  - { id: '2.14', enforcement: required, summary: 'Язык автоматически определяется на старте через ysdk.environment.i18n.lang даже для одноязычной игры.', applicability: always, verification: sdk-i18n-e2e }
  - { id: '3.1', enforcement: repealed, summary: 'Упразднен; см. раздел 8.', applicability: never, verification: none }
  - { id: '3.2', enforcement: repealed, summary: 'Упразднен; см. раздел 8.', applicability: never, verification: none }
  - { id: '3.3', enforcement: repealed, summary: 'Упразднен; см. раздел 8.', applicability: never, verification: none }
  - { id: '3.4.1', enforcement: repealed, summary: 'Упразднен; см. раздел 8.', applicability: never, verification: none }
  - { id: '3.4.2', enforcement: required, summary: 'Нет эзотерики и гаданий.', applicability: always, verification: content-review }
  - { id: '3.4.3', enforcement: required, summary: 'Нет реалистичного насилия или жестокого обращения с детьми и животными.', applicability: always, verification: content-review }
  - { id: '3.4.4', enforcement: required, summary: 'Нет изображений и отсылок к политике, конфликтам и войнам.', applicability: always, verification: content-review }
  - { id: '3.4.5', enforcement: required, summary: 'Нет изображений и отсылок к религии и религиозной атрибутике.', applicability: always, verification: content-review }
  - { id: '3.4.6', enforcement: required, summary: 'Нет предсказаний о жизни, здоровье, заболеваниях или смерти игрока.', applicability: always, verification: content-review }
  - { id: '3.5', enforcement: required, summary: 'Права на все материалы подтверждены; документы при необходимости встроены текстом.', applicability: always, verification: rights-manifest }
  - { id: '3.6', enforcement: required, summary: 'Игра не копирует чужие игры и не дублирует игры этого разработчика.', applicability: always, verification: originality-review }
  - { id: '3.7.1', enforcement: required, summary: 'Нет выигрыша или вывода реальных денег и внешних призов.', applicability: always, verification: product-review }
  - { id: '3.7.2', enforcement: required, summary: 'Игра не является магазином, азартной игрой или онлайн-лотереей.', applicability: always, verification: product-review }
  - { id: '3.7.3', enforcement: repealed, summary: 'Упразднен; см. 1.4.', applicability: never, verification: none }
  - { id: '3.8', enforcement: repealed, summary: 'Упразднен; см. 1.13.2.', applicability: never, verification: none }
  - { id: '3.9', enforcement: required, summary: 'Видео не позволяет переходить на внешние ресурсы; YouTube-плеер не используется.', applicability: media, verification: source-and-e2e }
  - { id: '4.1', enforcement: required, summary: 'Реклама вызывается только через SDK Яндекс Игр; сторонней рекламы нет.', applicability: ads, verification: source-and-runtime }
  - { id: '4.2', enforcement: required, summary: 'Игровой процесс сохраняется после перехода по рекламе и возврата.', applicability: ads, verification: ad-e2e }
  - { id: '4.3', enforcement: required, summary: 'Ориентация рекламных блоков соответствует ориентации игры.', applicability: ads, verification: ad-e2e-manual }
  - { id: '4.4', enforcement: required, summary: 'Реклама не мешает игре и показывается только в логических паузах.', applicability: ads, verification: ad-policy-e2e }
  - { id: '4.5', enforcement: required, summary: 'Rewarded video запускается добровольно и выдает внутреннюю награду после подтверждения.', applicability: rewarded-ads, verification: rewarded-e2e }
  - { id: '4.5.1', enforcement: required, summary: 'Кнопка явно сообщает о рекламе и конкретной награде.', applicability: rewarded-ads, verification: copy-visual-review }
  - { id: '4.5.2', enforcement: required, summary: 'Rewarded-награда дополнительная и не блокирует продолжение основной игры.', applicability: rewarded-ads, verification: product-review }
  - { id: '4.6.1', enforcement: required, summary: 'Дополнительные рекламные блоки — только стики-баннеры.', applicability: banner-ads, verification: product-review }
  - { id: '4.6.2', enforcement: required, summary: 'Кастомные RTB-баннеры не используются.', applicability: ads, verification: source-scan }
  - { id: '4.7', enforcement: required, summary: 'Во время полноэкранной рекламы звук и игровой процесс поставлены на паузу.', applicability: fullscreen-ads, verification: ad-lifecycle-e2e }
  - { id: '5.1.1', enforcement: required, summary: 'Промоматериалы состоят из материалов игры или прямо связаны с ней.', applicability: marketing, verification: marketing-review }
  - { id: '5.1.1.1', enforcement: required, summary: 'Не используется геймплей других игр и одинаковые промоматериалы разных игр.', applicability: marketing, verification: marketing-originality-review }
  - { id: '5.1.1.2', enforcement: required, summary: 'Скриншоты показывают реальный геймплей не менее чем на 70% изображения.', applicability: screenshots, verification: screenshot-review }
  - { id: '5.1.1.3', enforcement: required, summary: 'Видео показывает реальный геймплей не менее чем на 70% продолжительности.', applicability: marketing-video, verification: video-review }
  - { id: '5.1.2', enforcement: required, summary: 'Промоматериалы ясно показывают суть, особенности и преимущества игры.', applicability: marketing, verification: marketing-review }
  - { id: '5.1.3', enforcement: required, summary: 'Название на каждом языке одинаково в игре, черновике и промоматериалах.', applicability: always, verification: title-consistency }
  - { id: '5.2', enforcement: required, summary: 'Все обязательные поля черновика заполнены и скриншоты добавлены.', applicability: always, verification: draft-checklist }
  - { id: '5.3', enforcement: required, summary: 'Тексты и файлы соответствуют актуальным ограничениям формы черновика.', applicability: always, verification: draft-checklist }
  - { id: '5.4', enforcement: required, summary: 'Теги и ключевые слова соответствуют игре.', applicability: always, verification: metadata-review }
  - { id: '5.5', enforcement: repealed, summary: 'Упразднен; см. раздел 8.', applicability: never, verification: none }
  - { id: '5.6', enforcement: required, summary: 'Иконка и обложка не являются скриншотами из игры.', applicability: marketing, verification: marketing-review }
  - { id: '5.7', enforcement: repealed, summary: 'Упразднен; см. раздел 8.', applicability: never, verification: none }
  - { id: '5.8', enforcement: repealed, summary: 'Упразднен; см. раздел 8.', applicability: never, verification: none }
  - { id: '5.9', enforcement: required, summary: 'Черные поля в медиаматериалах допустимы только как часть самой игры.', applicability: marketing, verification: marketing-review }
  - { id: '5.10', enforcement: repealed, summary: 'Упразднен; см. раздел 8.', applicability: never, verification: none }
  - { id: '5.11', enforcement: required, summary: 'Нет искусственно повторенных символов и дублирующихся текстов для обхода лимитов.', applicability: always, verification: copy-scan }
  - { id: '5.12', enforcement: required, summary: 'Название уникально в каталоге на всех выбранных языках.', applicability: always, verification: manual-catalog-check }
  - { id: '6.1', enforcement: recommended, summary: 'Указана электронная почта для обратной связи.', applicability: always, verification: draft-checklist }
  - { id: '6.2', enforcement: recommended, summary: 'Есть возможность отключить звук.', applicability: audio, verification: e2e }
  - { id: '6.3', enforcement: recommended, summary: 'Есть возможность поставить игровой процесс на паузу.', applicability: gameplay, verification: e2e }
  - { id: '6.4', enforcement: recommended, summary: 'В DevTools нет ошибок консоли.', applicability: always, verification: console-e2e }
  - { id: '6.5', enforcement: recommended, summary: 'Название не содержит слова «игра» или game без необходимости.', applicability: always, verification: metadata-review }
  - { id: '6.6', enforcement: recommended, summary: 'Название лаконичное.', applicability: always, verification: metadata-review }
  - { id: '6.7', enforcement: recommended, summary: 'Нет бесполезных элементов управления на заявленных платформах.', applicability: always, verification: ux-review }
  - { id: '6.8', enforcement: recommended, summary: 'Для сложной механики есть обучение на старте.', applicability: complex-gameplay, verification: tutorial-review }
  - { id: '6.9', enforcement: recommended, summary: 'Ручной выбор языка понятен без знания текущего языка.', applicability: manual-language-switch, verification: localization-ux-review }
  - { id: '7', enforcement: repealed, summary: 'Раздел упразднен.', applicability: never, verification: none }
  - { id: '8.1', enforcement: required, summary: 'Правила текстов и медиаматериалов применяются ко всем объектам игры и черновика.', applicability: always, verification: umbrella-review }
  - { id: '8.2.1', enforcement: required, summary: 'Тексты соответствуют орфографии и пунктуации языка.', applicability: always, verification: copy-review }
  - { id: '8.2.2', enforcement: required, summary: 'Тексты правдиво отражают механику и не вводят игрока в заблуждение.', applicability: always, verification: copy-product-review }
  - { id: '8.2.3', enforcement: required, summary: 'Все значимые для геймплея тексты переведены на выбранный язык.', applicability: localization, verification: localization-audit }
